name: Vector Machine CI

on:
  push:
    branches: [develop, master]
    paths:
      - 'crates/**'
      - 'apps/vectorcraft-web/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/vector-machine-ci.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'crates/**'
      - 'apps/vectorcraft-web/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/vector-machine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-machine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web build artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vector-machine-web
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/trunk.tar.gz"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP" trunk
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build web app
        working-directory: apps/vectorcraft-web
        run: trunk build --release --locked
      - name: Verify web output
        run: |
          test -s dist/web/index.html
          find dist/web -name '*.wasm' -size +0c | grep -q .
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vector-machine-web
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
