name: Vector Machine CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-machine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Quality and desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vector-machine-quality
      - name: Verify locked dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Upstream quality gates
        run: cargo xtask ci
      - name: Build desktop app
        run: cargo build --locked -p vectorcraft
      - name: Headless export smoke check
        run: |
          cargo run --locked -p vectorcraft-cli -- run \
            --in examples/dusk-poster.vectorcraft --export "$RUNNER_TEMP/vector-machine-smoke.png"
          test -s "$RUNNER_TEMP/vector-machine-smoke.png"
      - name: Verify lockfile stayed unchanged
        run: git diff --exit-code -- Cargo.lock

  web:
    name: Web build artifact
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vector-machine-web
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/trunk.tar.gz"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP" trunk
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build web app
        working-directory: apps/vectorcraft-web
        run: trunk build --release --locked
      - name: Verify web output
        run: |
          test -s dist/web/index.html
          find dist/web -name '*.wasm' -size +0c | grep -q .
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vector-machine-web
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
